version: '3'
vars:
  PRESET: '{{default "dev" .PRESET}}'
  BUILD_DIR: build/{{.PRESET}}
  RELEASE_BUILD_DIR: build/release
  SCALE_FACTOR: '{{default "1.0" .SCALE_FACTOR}}'
  NPROC:
    sh: nproc
tasks:
  license-check:
    desc: Validate REUSE licensing metadata
    cmds:
    - reuse lint
  run:
    desc: Build and run holonight-chat (SCALE_FACTOR defaults to 1.0)
    deps:
    - build
    cmds:
    - QT_SCALE_FACTOR={{.SCALE_FACTOR}} ./{{.BUILD_DIR}}/holonight-chat
  install:local:
    desc: Build and install to ~/.local
    deps:
    - build
    cmds:
    - cmake -B {{.BUILD_DIR}} -DCMAKE_INSTALL_PREFIX="$HOME/.local"
    - cmake --build {{.BUILD_DIR}} -j{{.NPROC}}
    - cmake --install {{.BUILD_DIR}}
  install:system:
    desc: Install to /usr (requires sudo)
    deps:
    - build:release
    cmds:
    - cmake -B {{.RELEASE_BUILD_DIR}} -DCMAKE_INSTALL_PREFIX=/usr
    - cmake --build {{.RELEASE_BUILD_DIR}} -j{{.NPROC}}
    - sudo cmake --install {{.RELEASE_BUILD_DIR}}
  coverage:
    desc: Build coverage report
    cmds:
    - cmake --preset dev -B build/coverage -DENABLE_COVERAGE=ON
    - cmake --build build/coverage --target coverage
  qml-lint:
    desc: qml-lint
    cmds:
    - cmake --build build/{{.PRESET}} --target qml-lint
  qmltypes-check:
    desc: Verify generated HolonightChat QML type metadata
    deps:
    - build
    cmds:
    - bash scripts/check-qmltypes.sh build/{{.PRESET}}
  clean:
    desc: Remove the build directory
    cmds:
    - rm -rf {{.BUILD_DIR}}
    prompt: Remove {{.BUILD_DIR}}/ entirely?
  qml-import-check:
    desc: qml-import-check
    cmds:
    - python3 scripts/check-runtime-imports.py
  check:
    desc: Authoritative container acceptance
    cmds:
    - python3 scripts/ci/container.py check {{.CLI_ARGS}}
  configure:
    desc: configure
    cmds:
    - cmake --preset {{.PRESET}} {{.CLI_ARGS}}
  build:
    desc: build
    cmds:
    - cmake --preset {{.PRESET}}
    - cmake --build --preset {{.PRESET}}
  test:
    desc: test
    cmds:
    - task: build
      vars:
        PRESET: dev
    - dbus-run-session -- ctest --preset dev {{.CLI_ARGS}}
  configure:release:
    desc: configure:release
    cmds:
    - cmake --preset release {{.CLI_ARGS}}
  build:release:
    desc: build:release
    cmds:
    - cmake --preset release
    - cmake --build --preset release
  format:
    desc: Format with the pinned container tools
    cmds:
    - python3 scripts/ci/container.py format
  format-check:
    desc: format-check
    cmds:
    - python3 scripts/quality.py format-check
  tidy:
    desc: tidy
    cmds:
    - python3 scripts/quality.py tidy --build build/{{.PRESET}}
  check:integration:
    desc: Container acceptance plus Release staging and runtime checks
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
