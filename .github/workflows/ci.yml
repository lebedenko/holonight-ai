name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Debug

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    container: ghcr.io/lebedenko/holonight-ai-ci:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install config-provider build dependency
        run: pacman -S --noconfirm tomlplusplus

      - name: Checkout holonight-config dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: 5cd36ec9986801c4b831527a38e7b7414b9a1312
          path: holonight-config-dep

      - name: Checkout holonight-qt dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: a45f7552054abbc6cbd66609e802b43b9b8ee894
          path: holonight-qt-dep

      - name: Build and install pinned dependencies
        run: |
          cmake -S holonight-config-dep -B holonight-config-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build holonight-config-dep/build --parallel
          cmake --install holonight-config-dep/build --prefix /usr
          cmake -S holonight-qt-dep -B holonight-qt-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr
          cmake --build holonight-qt-dep/build --parallel
          cmake --install holonight-qt-dep/build --prefix /usr

      - name: Configure
        run: >
          cmake -B build -G Ninja -S .
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: QML lint
        run: cmake --build build --target qml-lint

      - name: QML type metadata check
        run: scripts/check-qmltypes.sh build

  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    container: ghcr.io/lebedenko/holonight-ai-ci:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install config-provider build dependency
        run: pacman -S --noconfirm tomlplusplus

      - name: Checkout holonight-config dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: 5cd36ec9986801c4b831527a38e7b7414b9a1312
          path: holonight-config-dep

      - name: Checkout holonight-qt dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: a45f7552054abbc6cbd66609e802b43b9b8ee894
          path: holonight-qt-dep

      - name: Build and install pinned dependencies
        run: |
          cmake -S holonight-config-dep -B holonight-config-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build holonight-config-dep/build --parallel
          cmake --install holonight-config-dep/build --prefix /usr
          cmake -S holonight-qt-dep -B holonight-qt-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr
          cmake --build holonight-qt-dep/build --parallel
          cmake --install holonight-qt-dep/build --prefix /usr

      - name: Configure
        run: >
          cmake -B build -G Ninja -S .
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTS=ON

      - name: Format check
        run: cmake --build build --target format-check

      - name: Clang tidy
        run: cmake --build build --target tidy
