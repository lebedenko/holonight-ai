name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  acceptance:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane: [build-test, release, static-checks]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/run.py --prepare
      - run: python3 scripts/ci/run.py --lane ${{ matrix.lane }}
